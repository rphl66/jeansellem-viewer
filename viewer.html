<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewer</title>

  <!-- Skin facultatif de WebViewer -->
  <link rel="stylesheet" href="pdfjs/viewer.css?v=31" />

  <style>
    /* L'iframe qui contient ce fichier remplit tout l’espace ; on harmonise le fond */
    html, body {
      height: 100%;
      margin: 0;
      background: #f7f7f7;
    }
    #viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <!-- Librairie WebViewer -->
  <script src="pdfjs/webviewer.min.js"></script>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const file = params.get('file') || 'sample.pdf';
    const bg   = params.get('bg')   || '#f7f7f7'; // surcharge possible via ?bg=%23f7f7f7

    WebViewer({
      path: 'pdfjs',
      licenseKey: 'WQbdx5KD5SbQkjFwosWR',
      css: 'pdfjs/viewer.css?v=31',
      initialDoc: file
    }, document.getElementById('viewer')).then(instance => {
      const { UI, Core } = instance;
      const dv = Core.documentViewer;

      /* CSS injecté DANS l’UI interne du WebViewer */
      const KILL_CSS = `
        :root { --viewer-bg: ${bg}; }

        /* Fond global partout */
        html, body, #app, .App,
        .ui__layout, .ui__content,
        .DocumentContainer, .documentContainer,
        .ScrollView, .PageContainer, .pageContainer {
          background: var(--viewer-bg) !important;
        }

        /* Masquer l’en-tête et les toolbars natives */
        [data-element="header"], #documentHeader, .Header, .Header * {
          display: none !important; height: 0 !important; min-height: 0 !important;
          padding: 0 !important; border: 0 !important;
        }
        [data-element="toolsHeader"], [data-element="toolsOverlay"],
        .toolsHeader, .toolsOverlay { display: none !important; }

        [data-element="pageNavOverlay"], [data-element="pageNavigationOverlay"],
        .PageNavOverlay, .pageNavOverlay { display: none !important; }

        /* === Supprimer totalement les panneaux/colonnes latérales et gouttières === */
        [data-element="leftPanel"], [data-element="rightPanel"],
        [data-element="leftPanelContainer"], [data-element="rightPanelContainer"],
        [data-element="notesPanel"], [data-element="thumbnailsPanel"],
        [data-element="searchPanel"], [data-element="outlinesPanel"],
        .LeftPanel, .leftPanel, .RightPanel, .rightPanel,
        .SidePanel, .sidePanel, .ui__side-panel, .ui__side-window {
          display: none !important;
          width: 0 !important; min-width: 0 !important; max-width: 0 !important;
        }

        /* Le contenu central occupe 100% */
        .ui__layout, .ui__content, .DocumentContainer, .documentContainer, .ScrollView {
          margin: 0 !important; padding: 0 !important;
          width: 100% !important; max-width: 100% !important;
        }

        /* Optionnel : pas d’ombre autour des pages */
        .pageContainer { box-shadow: none !important; }

        /* Masquer toutes les barres de scroll du viewer */
        html, body, .DocumentContainer, .PageContainer, .ScrollView, .ui__content, .ui__layout {
          scrollbar-width: none !important;     /* Firefox */
          overscroll-behavior: contain;
        }
        html *::-webkit-scrollbar {
          width: 0 !important; height: 0 !important; /* Chrome/Safari/Edge */
        }
      `;

      function injectCSSIntoUI () {
        try {
          const doc = UI.iframeWindow?.document;
          if (!doc || doc.querySelector('style[data-jsl-kill]')) return;
          const s = doc.createElement('style');
          s.setAttribute('data-jsl-kill', '');
          s.textContent = KILL_CSS;
          doc.head.appendChild(s);
        } catch (_) {}
      }

      function hideInternalUI () {
        try {
          UI.setHeaderItems?.(h => { h.splice(0, h.length); });
          UI.updateElement?.('header', { hidden: true, disabled: true });
          UI.disableElements?.([
            'toolsHeader','toolsOverlay','pageNavOverlay','pageNavigationOverlay',
            'ribbonsDropdownButton','menuButton','settingsButton','searchButton',
            'notesPanel','notesPanelButton','toggleNotesButton','toggleNotesPanelButton',
            'leftPanel','leftPanelButton','rightPanel','rightPanelButton',
            'shareButton','printButton','downloadButton','openFileButton',
            'languageButton','themeChangeButton','fullscreenButton','toolbarGroupButton',
            'thumbnailsPanel','searchPanel','outlinesPanel'
          ]);
          /* On ferme explicitement tout ce qui pourrait réserver une colonne */
          UI.closeElements?.([
            'leftPanel','rightPanel','notesPanel','thumbnailsPanel',
            'searchPanel','outlinesPanel','toolsHeader','toolsOverlay',
            'pageNavOverlay','pageNavigationOverlay'
          ]);
        } catch (_) {}
        injectCSSIntoUI();
      }

      hideInternalUI();

      /* Réinjection si l’UI se reconstruit */
      try {
        const uiDoc = UI.iframeWindow?.document;
        if (uiDoc) new MutationObserver(hideInternalUI)
          .observe(uiDoc.documentElement, { childList: true, subtree: true });
      } catch (_) {}

      /* FitWidth au chargement du PDF */
      dv.addEventListener('documentLoaded', () => {
        hideInternalUI();
        try { UI.setLayoutMode?.(UI.LayoutMode.Single); } catch(_) {}
        try { UI.setScrollMode?.(UI.ScrollMode.PAGE); } catch(_) {}
        try { UI.setPageTransitionMode?.(UI.PageTransitionMode.Page); } catch(_) {}
        try { UI.setFitMode?.(UI.FitMode.FitWidth); } catch(_) {}
        try { dv.setCurrentPage?.(1); } catch(_) {}
        setTimeout(() => { try { UI.setFitMode?.(UI.FitMode.FitWidth); } catch(_) {} }, 50);
      });

      /* Commandes reçues depuis la page parente (zoom, nav, etc.) */
      const actions = {
        zin   : () => UI.setZoomLevel?.((UI.getZoomLevel?.() ?? 1) * 1.1),
        zout  : () => UI.setZoomLevel?.((UI.getZoomLevel?.() ?? 1) / 1.1),
        first : () => dv.setCurrentPage?.(1),
        prev  : () => dv.setCurrentPage?.(Math.max(1, (dv.getCurrentPage?.()||1)-1)),
        next  : () => dv.setCurrentPage?.(Math.min(dv.getPageCount?.()||1, (dv.getCurrentPage?.()||1)+1)),
        last  : () => dv.setCurrentPage?.(dv.getPageCount?.()||1),
        fitp  : () => UI.setFitMode?.(UI.FitMode.FitPage),
        fitw  : () => UI.setFitMode?.(UI.FitMode.FitWidth),
        refresh: () => {
          try { UI.resize?.(); dv.refreshAll?.(); dv.updateView?.(); UI.setFitMode?.(UI.FitMode.FitWidth); } catch(_){}
          setTimeout(() => { try { UI.setFitMode?.(UI.FitMode.FitWidth); } catch(_) {} }, 30);
        },
      };

      window.addEventListener('message', (evt) => {
        const data = evt.data || {};
        if (data.type !== 'JSL_CMD') return;
        if (data.act in actions) {
          try { actions[data.act](); } catch (_) {}
          evt.source?.postMessage({ type: 'JSL_ACK', act: data.act }, evt.origin);
        }
      });

      window.addEventListener('resize', () => {
        try { UI.resize?.(); dv.updateView?.(); } catch(_) {}
      }, { passive: true });
    });
  })();
  </script>
</body>
</html>
